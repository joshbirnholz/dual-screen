name: DS icon probe
on:
  push:
    branches: [claude/ds-icon-probe]
permissions:
  contents: write
jobs:
  fill:
    if: ${{ !contains(github.event.head_commit.message, 'probe results') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: probe
      - uses: actions/checkout@v4
        with:
          ref: icons
          path: icons
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch every DS icon
        run: |
          pip install -q pillow
          cp probe/tools/build_ds_icons.py icons/tools/
          cd /tmp && python $GITHUB_WORKSPACE/icons/tools/build_ds_icons.py $GITHUB_WORKSPACE/icons 2>&1 | tee /tmp/ds-log.txt
      - name: Publish
        run: |
          cd icons
          cp /tmp/ds-log.txt tools/ds-fill-log.txt
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "DS icons, from DS-Scene's release list, named by the picture" && git push origin icons
          cd ../probe && tail -3 /tmp/ds-log.txt > probe-results.txt
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add probe-results.txt && git commit -m "probe results" && git push
