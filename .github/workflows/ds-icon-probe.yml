name: DS icon probe
on:
  push:
    branches: [claude/ds-icon-probe]
permissions:
  contents: write
jobs:
  fetch:
    if: ${{ !contains(github.event.head_commit.message, 'probe results') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch release pages
        run: |
          mkdir -p pages
          get() { curl -sSL -A "Mozilla/5.0" -o "pages/$1" -w "$1 %{http_code} %{size_download} %{url_effective}\n" "$2" >> pages/log.txt 2>&1 || echo "$1 failed" >> pages/log.txt; }
          get dats.html "https://www.advanscene.com/html/dats.php"
          get ndslist.html "https://www.advanscene.com/html/dbndslst.php"
          get dsscene-releases.xml "https://www.ds-scene.net/releases.xml"
          get dsscene-topic.html "https://www.ds-scene.net/?s=viewtopic&nid=13522"
      - name: Keep
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add pages && git commit -qm "probe results" && git push
