# Builds Dualscreen for SteamOS, the Switch and Android on every push, and
# publishes them together as one rolling pre-release, "nightly", on this
# repository's Releases page: the newest build always in the same place, which
# is what an app checking for updates will look at.
#
# Each build is its own job and they run side by side. The release is replaced
# with whichever of them succeeded, so one platform failing does not hold back
# the others -- the release notes say which are missing.
#
# Android's signing key comes from four repository secrets (see
# android/README.md). Without them the APK is signed with a key made for that
# one run, which installs on a clean device but never over another build.

name: Builds

on:
  push:
    branches: [claude/emulator-display-streaming-xnfjj0, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# One build at a time. A push while one is going waits for it to finish
# rather than cancelling it -- so what it built, and the caches it saves, are
# not thrown away -- and only the newest waiting push is kept: older ones are
# dropped, since the newest has their changes too.
concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  steamos:
    name: SteamOS
    runs-on: ubuntu-latest
    # Older than any SteamOS, for the reason tools/build-steamos.sh gives: a
    # binary built against an older glibc runs on a newer one.
    container: debian:12
    steps:
      - name: Tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential cmake pkg-config git ca-certificates nasm \
            libsdl2-dev libgl-dev zlib1g-dev libzstd-dev nlohmann-json3-dev \
            libva-dev libdrm-dev
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The minimal FFmpeg the script builds takes a few minutes and changes
      # only when its version does.
      - uses: actions/cache@v4
        with:
          path: .ffmpeg-steamos
          key: ffmpeg-steamos-${{ hashFiles('tools/build-steamos.sh') }}-debian12
      - name: Build
        env:
          DUALSCREEN_IN_CONTAINER: '1'
        run: ./tools/build-steamos.sh
      - name: Package
        run: |
          mkdir -p dist/dualscreen
          cp build/dualscreen build/dualscreen-companion dist/dualscreen/
          cp -L build/lib*.so* dist/dualscreen/ 2>/dev/null || true
          strip --strip-debug dist/dualscreen/dualscreen dist/dualscreen/dualscreen-companion
          tar -C dist -czf dualscreen-steamos.tar.gz dualscreen
      - uses: actions/upload-artifact@v4
        with:
          name: steamos
          path: dualscreen-steamos.tar.gz

  switch:
    name: Switch
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      # devkitPro's package server turns CI away (403): its images are meant
      # to be used as they come, with every Switch library already in them.
      # So nothing is installed from there -- only checked for, so a missing
      # one is named here rather than as a link error later.
      - name: Tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cmake git meson ninja-build
          # deko3d and its shader compiler, from source if the image lacks them.
          if [ ! -e "$DEVKITPRO/libnx/include/deko3d.hpp" ]; then
            git clone --depth 1 https://github.com/devkitPro/deko3d /tmp/deko3d
            make -C /tmp/deko3d -j"$(nproc)" install
          fi
          if [ ! -e "$DEVKITPRO/tools/bin/uam" ]; then
            git clone --depth 1 https://github.com/devkitPro/uam /tmp/uam
            meson setup /tmp/uam/build /tmp/uam --prefix="$DEVKITPRO/tools"
            ninja -C /tmp/uam/build install
          fi
          for file in portlibs/switch/lib/libSDL2.a portlibs/switch/lib/libz.a \
                      libnx/include/deko3d.hpp tools/bin/uam; do
            [ -e "$DEVKITPRO/$file" ] || { echo "::error::$DEVKITPRO/$file is not in the image"; exit 1; }
          done
          for optional in portlibs/switch/lib/libavcodec.a portlibs/switch/lib/libcurl.a; do
            [ -e "$DEVKITPRO/$optional" ] || echo "::warning::$DEVKITPRO/$optional is not in the image; built without it"
          done
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # RSDuck's melonDS, which draws on the GPU -- see switch/README.md.
      - name: The DS core's source
        run: git clone --depth 1 -b switch-new https://github.com/RSDuck/melonDS switch/cores/melonds-deko
      - name: Build
        run: |
          make -C switch/melonds_deko -j"$(nproc)"
          make -C switch -j"$(nproc)"
      - name: Package
        run: cp switch/Dualscreen.nro Dualscreen.nro
      - uses: actions/upload-artifact@v4
        with:
          name: switch
          path: Dualscreen.nro

  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The runner has the SDK already; only the parts this build pins are
      # added to it.
      - name: SDK parts
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-33" "cmake;3.22.1" "ndk;25.1.8937393"
      - name: SDL2's source
        run: git clone --depth 1 --branch release-2.30.9 https://github.com/libsdl-org/SDL android/app/jni/SDL
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Signing key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build (signed)
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease -PversionCode=${{ github.run_number }} -PversionName=0.1.${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk ../dualscreen-android.apk
      - name: Build (no key yet)
        if: env.HAS_KEY != 'true'
        working-directory: android
        run: |
          echo "::warning::No Android signing key in the repository's secrets; this APK is signed with a key made for this run alone."
          gradle assembleDebug -PversionCode=${{ github.run_number }} -PversionName=0.1.${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk ../dualscreen-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dualscreen-android.apk

  publish:
    name: Publish
    needs: [steamos, switch, android]
    # Whatever was built, even if something else was not.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Describe the build
        run: |
          ls -la dist
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "::error::Nothing was built."
            exit 1
          fi
          missing=""
          [ -f dist/dualscreen-steamos.tar.gz ] || missing="$missing SteamOS"
          [ -f dist/Dualscreen.nro ] || missing="$missing Switch"
          [ -f dist/dualscreen-android.apk ] || missing="$missing Android"
          short="${GITHUB_SHA::7}"
          cat > dist/version.json <<EOF
          {"build": ${{ github.run_number }}, "commit": "${GITHUB_SHA}", "branch": "${GITHUB_REF_NAME}", "built": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
          {
            echo "Build ${{ github.run_number }}, from ${short} on ${GITHUB_REF_NAME}."
            echo
            echo "- **SteamOS**: \`dualscreen-steamos.tar.gz\` -- unpack it anywhere and add \`dualscreen\` to Steam."
            echo "- **Switch**: \`Dualscreen.nro\` -- copy it to \`/switch/\` on the SD card."
            echo "- **Android**: \`dualscreen-android.apk\`."
            if [ "${{ needs.android.result }}" = "success" ] && [ "${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}" != "true" ]; then
              echo
              echo "The APK is signed with a key made for this build alone: it will not install over another build."
            fi
            if [ -n "$missing" ]; then
              echo
              echo "Not in this build, because it failed:$missing."
            fi
          } > notes.md
      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create nightly dist/* -R "$GITHUB_REPOSITORY" \
            --prerelease --target "$GITHUB_SHA" \
            --title "Nightly build ${{ github.run_number }}" --notes-file notes.md
