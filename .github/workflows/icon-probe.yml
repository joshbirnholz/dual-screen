name: Icon probe
on:
  push:
    branches: [claude/icon-probe]
permissions:
  contents: write
jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, 'probe results') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Try a few
        run: |
          pip install -q requests pycryptodome pillow
          echo | openssl s_client -connect idbe-wup.cdn.nintendo.net:443 -servername idbe-wup.cdn.nintendo.net 2>/dev/null | openssl x509 > cdn.pem
          export NINTENDO_CDN_CERT=$PWD/cdn.pem
          mkdir -p sample
          (cd /tmp && LIMIT=40 WIIU_FIRST=1010E0 WIIU_LAST=1010FF python $GITHUB_WORKSPACE/tools/build_icons.py $GITHUB_WORKSPACE/sample) > probe-results.txt 2>&1 || true
          ls sample/* >> probe-results.txt 2>&1
      - name: Keep the results
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add probe-results.txt sample && git commit -m "probe results" && git push
