apply plugin: 'com.android.application'

// Where the SDL2 source tree is. It is not vendored here -- it is large, it is
// not this project's code, and the version wants to be the reader's choice --
// so the build asks for it and says how to get it if it is missing. See
// android/README.md.
def sdlDir = file(System.getenv('SDL2_ANDROID_SRC') ?: 'jni/SDL')

// The ABIs built, here once so the native build and the DS core below agree.
// The G Cloud is arm64; the 32-bit ABI is there because plenty of Android
// handhelds are not. -Pabis=x86_64 (or any comma-separated list) builds for
// something else instead -- an x86_64 emulator, say.
def abis = (project.findProperty('abis') ?: 'arm64-v8a,armeabi-v7a').toString().split(',') as List

// The DS emulator, which is what lets this app play DS games itself rather
// than only join them: melonDS DS, the same libretro core the desktop app
// plays DS games with, as libretro's own buildbot builds it for Android. Like
// SDL2 it is not vendored -- it is GPL-3.0, several megabytes per ABI, and
// not this project's code -- so it is fetched once into jni/melonds-ds/ and
// packaged beside libmain.so, which loads it by name (see
// DS_BUNDLED_LIBRETRO_CORE in CMakeLists.txt).
//
// Optional: an APK without it is the companion alone, exactly as before, and
// says so in its log. DS_CORE_ANDROID_DIR points at a folder of your own
// instead, laid out <abi>/libmelondsds_libretro_android.so; -PnoDsCore
// leaves it out altogether.
def dsCoreName = 'libmelondsds_libretro_android.so'
def dsCoreDir = file(System.getenv('DS_CORE_ANDROID_DIR') ?: 'jni/melonds-ds')
def wantDsCore = !project.hasProperty('noDsCore')

android {
    namespace 'com.dualscreen.companion'
    // 33 is what the current SDL2 activity targets; the G Cloud runs 11 (30).
    compileSdk 33
    // No ndkVersion pin: whichever NDK is installed alongside the SDK is used.
    // Pinning one only turns a working machine into "NDK not found".

    defaultConfig {
        applicationId 'com.dualscreen.companion'
        // SDL2 needs 16+; 21 is the floor for the 64-bit ABIs and for the
        // toolchain to stop warning about it.
        //
        // Bionic gained getifaddrs() at 24, which src/net/transport.cpp checks
        // for: below that it broadcasts to all subnets instead of enumerating
        // interfaces. A companion never announces itself, so it does not need
        // the difference -- but raising this floor does change that code.
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName '0.1.0'

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
        // See `abis` at the top.
        ndk {
            abiFilters(*abis)
        }
    }

    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            // SDL2's own Java lives in its source tree and is compiled here,
            // because SDLActivity and libSDL2.so are two halves of one thing.
            java.srcDirs += "${sdlDir}/android-project/app/src/main/java"
            if (wantDsCore) {
                jniLibs.srcDirs += dsCoreDir
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// A missing SDL2 otherwise shows up as several hundred unresolved Java symbols,
// which says nothing about what to do.
tasks.configureEach { task ->
    if (task.name.startsWith('compile') || task.name.startsWith('externalNativeBuild')) {
        task.doFirst {
            if (!sdlDir.exists()) {
                throw new GradleException(
                    "Cannot find the SDL2 source at ${sdlDir}.\n" +
                    "Get it with:\n" +
                    "  git clone --depth 1 --branch release-2.30.9 " +
                    "https://github.com/libsdl-org/SDL android/app/jni/SDL\n" +
                    "or point SDL2_ANDROID_SRC at a copy you already have.")
            }
        }
    }
}

tasks.register('fetchDsCore') {
    description = 'Downloads the melonDS DS libretro core for each ABI, if it is not already here.'
    onlyIf { wantDsCore && System.getenv('DS_CORE_ANDROID_DIR') == null }
    doLast {
        abis.each { abi ->
            def target = new File(dsCoreDir, "${abi}/${dsCoreName}")
            if (target.exists()) {
                return
            }
            def url = "https://buildbot.libretro.com/nightly/android/latest/${abi}/" +
                      "melondsds_libretro_android.so.zip"
            def zip = new File(temporaryDir, "${abi}.zip")
            try {
                logger.lifecycle("Fetching the DS core for ${abi} from ${url}")
                new URL(url).withInputStream { input ->
                    zip.withOutputStream { output -> output << input }
                }
                copy {
                    from zipTree(zip)
                    include '*.so'
                    into target.parentFile
                    rename { dsCoreName }
                }
            } catch (Exception error) {
                // Not fatal: the APK is still a whole companion without it.
                logger.warn("Could not fetch the DS core for ${abi} (${error.message}); " +
                            "this build will join games but not play them itself.")
            }
        }
    }
}
preBuild.dependsOn 'fetchDsCore'
